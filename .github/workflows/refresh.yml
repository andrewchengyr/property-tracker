name: Refresh transactions

on:
  schedule:
    # Actions cron is UTC — Sun 20:00 UTC = Mon 04:00 SGT.
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write   # to commit the refreshed db + data.json
  pages: write      # to publish the site
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull latest transactions
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
        run: python -m ingest.run

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transactions.db web/data.json data/exports
          if git diff --staged --quiet; then
            echo "No new transactions."
          else
            git commit -m "chore: refresh transactions ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # GitHub Pages can only serve / or /docs from a branch, so the site is
  # published as an artifact instead — that way `web/` stays where the spec
  # puts it and no files have to be duplicated.
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
