name: Refresh transactions

on:
  schedule:
    # Actions cron is UTC — Sun 20:00 UTC = Mon 04:00 SGT.
    - cron: "0 20 * * 0"
  workflow_dispatch:      # Actions tab → Run workflow, for an on-demand refresh

permissions:
  contents: write   # commit the refreshed db + data.json
  pages: write      # publish the site
  id-token: write   # deploy-pages uses OIDC

# Never let a manual run and the cron fight over the same push.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pull_failed: ${{ steps.pull.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # continue-on-error so that a failed source still deploys the last good
      # data and still commits whatever did succeed; the run is failed at the
      # end instead, via the job output above.
      - name: Pull latest transactions
        id: pull
        continue-on-error: true
        env:
          URA_ACCESS_KEY: ${{ secrets.URA_ACCESS_KEY }}
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
        run: python -m ingest.run

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transactions.db web/data.json data/exports
          if git diff --staged --quiet; then
            echo "No new transactions."
          else
            git commit -m "chore: refresh transactions ($(date -u +%Y-%m-%d))"
            # Rebase first: a push of your own between runs would otherwise
            # make this job fail on a non-fast-forward.
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # GitHub Pages can only serve / or /docs from a branch, so the site is
  # published as an artifact instead — that way `web/` stays where the spec
  # puts it and no files have to be duplicated.
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Last, so the site is already live. Turns the run red when a source
      # broke — the only signal you get that a credential needs attention.
      - name: Surface ingestion failures
        if: needs.refresh.outputs.pull_failed == 'true'
        run: |
          echo "::error::A data source failed — see the 'Pull latest transactions' step. \
          The site was still deployed from the last good data."
          exit 1
