name: Refresh P1 balloting

# MOE publishes one P1 exercise at a time and replaces the page each year, so
# this is not weekly data. The 2025 exercise appeared in January 2026 and was
# still being corrected in February, with folder-level edits into April — so a
# single annual pull would miss the revisions. Every two months is six cheap
# requests a year and catches them.
#
# Split out of refresh.yml rather than bolted onto it for two reasons: the
# cadence is completely different, and this source cannot currently be fetched
# from a GitHub runner at all (see below). Leaving it in the weekly job made
# that job red every week, which buries the failures that actually matter —
# a URA throttle was already hiding behind it.
#
# KNOWN ISSUE: the runner receives ~2.4 KB instead of the real 728 KB page.
# That is far too small to be even a shell of it, so it is a different response
# entirely — most likely a block served to datacentre IPs, since the identical
# request from a residential connection returns the full page. The fetch now
# logs status, content-type and the first part of the body so the next failure
# identifies itself instead of being guessed at. If it turns out to be
# unfixable from CI, run it locally instead:
#
#     python -m ingest.run --skip-ura --skip-hdb --skip-rentals
#
# and this workflow's failure becomes a useful reminder that a pull is due.

on:
  schedule:
    # 21:00 UTC on the 5th = 05:00 SGT on the 6th, every second month.
    - cron: "0 21 5 1,3,5,7,9,11 *"
  workflow_dispatch:

permissions:
  contents: write

# Its own group: this must never cancel a weekly data refresh, and a weekly
# refresh must never cancel this.
concurrency:
  group: ballot
  cancel-in-progress: true

jobs:
  ballot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Transactions, rentals and geocoding are the weekly job's business.
      # This pulls the balloting archive and the school directory it attaches
      # to, and nothing else.
      - name: Pull P1 balloting
        run: python -m ingest.run --skip-ura --skip-hdb --skip-rentals

      # Deliberately no deploy step. Pages is published from exactly one place
      # — refresh.yml — so two workflows can never race for the same
      # deployment. Balloting changes about once a year, so waiting up to a
      # week for the Sunday refresh to publish it costs nothing.
      - name: Commit if the balloting archive changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transactions.db web/schools.json
          if git diff --staged --quiet; then
            echo "No change to the balloting archive."
          else
            git commit -m "chore: refresh P1 balloting ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi
