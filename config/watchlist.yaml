# ─────────────────────────────────────────────────────────────────────────────
# THE CONTROL PANEL
#
# Add or remove properties here and re-run the ingestion — no code changes.
#   python -m ingest.run
#
# Entries are forgiving: whitespace is trimmed, HDB fields are uppercased to
# match the dataset. An entry that matches nothing logs a warning and the rest
# of the run continues.
# ─────────────────────────────────────────────────────────────────────────────

# Private residential (URA caveats).
# Matched against URA "project" names, case-insensitive "contains".
# So "trevista" matches "TREVISTA". Partial names are fine.
#
# top_year is optional: URA caveats carry the lease commencement year but not
# the completion date, so TOP has to be supplied here if you want it shown.
# Everything else (tenure, lease start, years remaining) is derived.
private:
  - project: "TREVISTA"
    top_year: 2011        # lease commenced 2008; TOP 2011

# HDB resale (data.gov.sg).
#
# town + flat_type are required. All other keys are optional narrowing:
#   block, street_name  — a single building or street
#   flat_model          — Improved / DBSS / Maisonette / Apartment / Model A …
#   lease_from          — minimum lease_commence_date, i.e. "built from year X"
#
# Street names are abbreviated in the dataset ("LOR 1A TOA PAYOH", "BISHAN
# ST 13", "UPP SERANGOON RD"); either form works here.
#
# NOTE ON "EXECUTIVE MAISONETTE" / "EXECUTIVE APARTMENT": these are not
# flat_type values. The dataset's flat_type is EXECUTIVE, and maisonette vs
# apartment lives in flat_model — hence the two entries below.
hdb:
  # Every 5-room in Toa Payoh built from 2000 on. Covers the Lor 1A DBSS
  # blocks (lease 2012), Lor 2 (2001/2002/2006), Toa Payoh Ctrl (2009) and
  # Bidadari Park Drive (2020) — Bidadari sits in the TOA PAYOH HDB town
  # despite being ~2 km east, so it will appear off to one side of the map.
  - town: "TOA PAYOH"
    flat_type: "5 ROOM"
    lease_from: 2000

  # Every executive flat in Toa Payoh — 139 maisonettes + 44 apartments
  # across 23 blocks. Deliberately NO lease_from here: HDB stopped building
  # executive flats in the mid-90s, so this stock is all 1984-1995 and any
  # lease bound at 2000 would exclude all of it.
  #
  # One entry rather than two: flat_model narrows client-side, and
  # Maisonette + Apartment are the only models present, so a single call
  # fetches both and keeps them as separate properties automatically.
  - town: "TOA PAYOH"
    flat_type: "EXECUTIVE"
