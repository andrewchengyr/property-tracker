# ─────────────────────────────────────────────────────────────────────────────
# THE CONTROL PANEL
#
# Add or remove properties here and re-run the ingestion — no code changes.
#   python -m ingest.run
#
# Entries are forgiving: whitespace is trimmed, HDB fields are uppercased to
# match the dataset. An entry that matches nothing logs a warning and the rest
# of the run continues.
# ─────────────────────────────────────────────────────────────────────────────

# Private residential (URA caveats).
# Matched against URA "project" names, case-insensitive "contains".
# So "trevista" matches "TREVISTA". Partial names are fine.
#
# top_year is optional: URA caveats carry the lease commencement year but not
# the completion date, so TOP has to be supplied here if you want it shown.
# Everything else (tenure, lease start, years remaining) is derived.
private:
  - project: "TREVISTA"
    top_year: 2011        # lease commenced 2008; TOP 2011

  # Both on Bishan Street 15, next to Bishan MRT. Matching is "contains", and
  # neither name is a prefix of another URA project, so these pull only
  # themselves — "SKY" alone would drag in a dozen unrelated developments.
  - project: "SKY VUE"
    top_year: 2016        # lease commenced 2013
  - project: "SKY HABITAT"
    top_year: 2015        # lease commenced 2011

  # Every condo / apartment / EC in the Toa Payoh and Bishan planning areas.
  #
  # `planning_area` is decided by point-in-polygon against OneMap's official
  # boundary — the same areas the HDB towns are named after. `districts` is
  # only a pre-filter bounding how many projects get geocoded before that test
  # runs; it is deliberately loose, because postal districts are much wider
  # than the areas (D12 is Balestier + Toa Payoh + Serangoon, D20 is Ang Mo Kio
  # + Bishan + Thomson). The polygon, not the district, decides.
  #
  # Landed is excluded by default — see DEFAULT_PRIVATE_TYPES in ingest/run.py.
  # Add `property_types: [...]` to an entry to change that.
  - planning_area: "TOA PAYOH"
    districts: ["12", "13"]      # Potong Pasir side of the area sits in D13

  - planning_area: "BISHAN"
    districts: ["20"]

# HDB resale (data.gov.sg).
#
# town + flat_type are required. All other keys are optional narrowing:
#   block, street_name  — a single building or street
#   flat_model          — Improved / DBSS / Maisonette / Apartment / Model A …
#   lease_from          — minimum lease_commence_date, i.e. "built from year X"
#
# Street names are abbreviated in the dataset ("LOR 1A TOA PAYOH", "BISHAN
# ST 13", "UPP SERANGOON RD"); either form works here.
#
# NOTE ON "EXECUTIVE MAISONETTE" / "EXECUTIVE APARTMENT": these are not
# flat_type values. The dataset's flat_type is EXECUTIVE, and maisonette vs
# apartment lives in flat_model — hence the two entries below.
hdb:
  # Every 5-room in Toa Payoh, no lease bound — leases run from the 1960s
  # blocks around Toa Payoh Central right through to Bidadari Park Drive
  # (2020). Bidadari sits in the TOA PAYOH HDB town despite being ~2 km east,
  # as do Potong Pasir, Joo Seng and Kim Keat, so this spreads well beyond
  # Toa Payoh proper. Add `lease_from` back to restrict to newer stock.
  - town: "TOA PAYOH"
    flat_type: "5 ROOM"

  # Every executive flat in Toa Payoh — 139 maisonettes + 44 apartments
  # across 23 blocks. Deliberately NO lease_from here: HDB stopped building
  # executive flats in the mid-90s, so this stock is all 1984-1995 and any
  # lease bound at 2000 would exclude all of it.
  #
  # One entry rather than two: flat_model narrows client-side, and
  # Maisonette + Apartment are the only models present, so a single call
  # fetches both and keeps them as separate properties automatically.
  - town: "TOA PAYOH"
    flat_type: "EXECUTIVE"

  # Bishan, whole town, no lease bound — 1,223 five-room transactions across
  # 126 blocks and 421 executive across 58. Much larger than the Toa Payoh
  # entries above, so the map is correspondingly busier; add `street_name` or
  # `lease_from` here to narrow it.
  - town: "BISHAN"
    flat_type: "5 ROOM"

  - town: "BISHAN"
    flat_type: "EXECUTIVE"
